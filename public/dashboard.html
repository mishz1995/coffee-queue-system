<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم البارستا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto p-4 max-w-6xl">
        <div class="dashboard-header">
            <div>
                <h1>☕ لوحة البارستا</h1>
                <div class="subtitle">إدارة طلبات المقهى في الوقت الفعلي</div>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button onclick="openNewOrderModal()" class="btn btn-primary">➕ طلب جديد</button>
                <button onclick="refreshOrders()" class="btn btn-secondary">🔄 تحديث</button>
            </div>
        </div>
        
        <div class="dashboard-stats">
            <div class="stat-card"><div class="number" id="totalOrders">0</div><div class="label">إجمالي الطلبات</div></div>
            <div class="stat-card"><div class="number yellow" id="waitingOrders">0</div><div class="label">في الانتظار</div></div>
            <div class="stat-card"><div class="number orange" id="preparingOrders">0</div><div class="label">قيد التحضير</div></div>
            <div class="stat-card"><div class="number green" id="readyOrders">0</div><div class="label">جاهز للاستلام</div></div>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm p-4">
            <h2 class="text-lg font-bold text-gray-800 mb-4">📋 الطلبات النشطة</h2>
            <div id="ordersList" class="space-y-2">
                <div class="text-center text-gray-400 py-8">لا توجد طلبات نشطة حالياً</div>
            </div>
        </div>
    </div>
    
    <!-- مودال إضافة طلب -->
    <div id="newOrderModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>📝 طلب جديد</h2>
            <form id="newOrderForm" onsubmit="createNewOrder(event)">
                <div class="form-group">
                    <label>اسم العميل</label>
                    <input type="text" id="customerNameInput" placeholder="أدخل اسم العميل">
                </div>
                <div class="form-group">
                    <label>تفاصيل الطلب</label>
                    <input type="text" id="orderDetailsInput" placeholder="مثال: كابتشينو، كرواسان">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit">إنشاء الطلب</button>
                    <button type="button" class="btn-cancel" onclick="closeNewOrderModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- مودال QR Code -->
    <div id="qrModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>📱 رمز QR للطلب</h2>
            <div class="qr-preview">
                <img id="qrModalImage" src="" alt="QR Code">
                <div class="qr-label" id="qrModalOrderNumber">#0000</div>
            </div>
            <div class="form-actions" style="margin-top:16px;">
                <button onclick="closeQRModal()" class="btn-cancel">إغلاق</button>
                <button onclick="printQR()" class="btn-submit">🖨️ طباعة</button>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let orders = [];
        let currentQRData = null;

        function initSocket() {
            socket = io();
            socket.on('connect', () => {
                console.log('✅ Dashboard connected');
                socket.emit('get-active-orders');
            });
            socket.on('orders-update', (updatedOrders) => {
                orders = updatedOrders;
                renderOrders(orders);
                updateStats(orders);
            });
            socket.on('error', (data) => {
                console.error('❌ Socket error:', data);
                alert('حدث خطأ: ' + data.message);
            });
        }

        function renderOrders(ordersList) {
            const container = document.getElementById('ordersList');
            if (!ordersList || ordersList.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-8">🎉 لا توجد طلبات نشطة حالياً</div>`;
                return;
            }
            const sorted = [...ordersList].sort((a, b) => a.number - b.number);
            container.innerHTML = sorted.map(order => `
                <div class="order-card status-${order.status}">
                    <div class="order-info">
                        <div class="order-number-big">#${order.number}</div>
                        <div>
                            <div class="order-name">${order.customerName}</div>
                            <div class="order-details-text">${order.orderDetails}</div>
                            <div class="order-time-text">${new Date(order.timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}</div>
                        </div>
                    </div>
                    <div class="order-actions">${getStatusButtons(order)}</div>
                </div>
            `).join('');
        }

        function getStatusButtons(order) {
            const status = order.status;
            let buttons = '';
            if (status === 'waiting') buttons += `<button onclick="updateOrder('${order.id}', 'preparing')" class="btn btn-prepare">🧑‍🍳 بدء التحضير</button>`;
            if (status === 'preparing') buttons += `<button
