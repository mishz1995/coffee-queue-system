<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام المقاهي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            padding: 20px;
            direction: rtl;
        }
        .login-container {
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-container h1 {
            font-size: 28px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .login-container .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #F59E0B;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #F59E0B;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: #D97706;
            transform: scale(1.02);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .footer-text {
            margin-top: 16px;
            font-size: 12px;
            color: #94a3b8;
        }
        .demo-credentials {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            font-size: 13px;
            color: #64748b;
            text-align: right;
        }
        .demo-credentials strong {
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div style="font-size: 48px; margin-bottom: 8px;">☕</div>
        <h1>نظام المقاهي</h1>
        <p class="subtitle">سجل الدخول لإدارة طلباتك</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="usernameInput" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" required>
            </div>
            
            <div class="error-message" id="errorMessage">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
            
            <button type="submit" class="btn-login" id="loginBtn">🚀 دخول</button>
        </form>
        
        <div class="demo-credentials">
            <div><strong>👑 مدير عام:</strong> admin / admin123</div>
            <div><strong>☕ مقهى تجريبي:</strong> mi_cafe / mi123456</div>
        </div>
        
        <p class="footer-text">🔒 جميع البيانات مشفرة وآمنة</p>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorMsg = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                errorMsg.textContent = '❌ الرجاء إدخال اسم المستخدم وكلمة المرور';
                errorMsg.classList.add('show');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ جاري...';
            errorMsg.classList.remove('show');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.shop.isAdmin) {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                } else {
                    errorMsg.textContent = '❌ ' + data.error;
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.textContent = '❌ حدث خطأ في الاتصال بالخادم';
                errorMsg.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '🚀 دخول';
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        async function checkSession() {
            try {
                const response = await fetch('/api/current-shop');
                const data = await response.json();
                if (data.success) {
                    if (data.shop.isAdmin) {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                }
            } catch (error) {
                console.log('No active session');
            }
        }
        checkSession();
    </script>
</body>
</html>
