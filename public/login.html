<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Order Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <script src="/i18n.js"></script>

    <style>
        body {
            background: var(--bg-dark2-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-family);
            padding: 20px;
            transition: background 0.3s ease;
        }
        
        .login-container  {
            background: var(--bg-dark-color);
            border-radius: var(--border-radius);
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: #e2e8f0 0px 30px 80px;
            text-align: center;
            transition: background 0.3s ease;
        }
        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            display: block;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .login-container h1  {
            font-size: 28px;
            font-weight: 800;
            color: var(--darkText);
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }
        
        .login-container .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: start;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            background: var(--bg-color);
            color: var(--text-color);
            transition: border-color 0.3s ease, background 0.3s ease, color 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--button-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .footer-text {
            margin-top: 16px;
            font-size: 12px;
            color: #94a3b8;
        }
        .demo-credentials {
            margin-top: 20px;
            padding: 16px;
            background: var(--bg-color);
            border-radius: 12px;
            font-size: 13px;
            color: #64748b;
            text-align: start;
            transition: background 0.3s ease;
        }
        .demo-credentials strong {
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img class="login-logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E☕%3C/text%3E%3C/svg%3E" alt="Logo">
        <h1 data-i18n="login_title">دخول على النظام</h1>
        <p class="subtitle" data-i18n="login_subtitle">سجل الدخول لإدارة طلباتك</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label data-i18n="username">اسم المستخدم</label>
                <input type="text" id="usernameInput" data-i18n-placeholder="username_placeholder" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label data-i18n="password">كلمة المرور</label>
                <input type="password" id="passwordInput" data-i18n-placeholder="password_placeholder" placeholder="أدخل كلمة المرور" required>
            </div>
            
            <div class="error-message" id="errorMessage" data-i18n="login_error">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
            
            <button type="submit" class="btn-login" id="loginBtn" data-i18n="login_button">🚀 دخول</button>
        </form>
        
        <div class="demo-credentials">
            <div><strong data-i18n="admin_credentials">👑 مدير عام</strong>: admin / admin123</div>
        </div>
        
        <p class="footer-text" data-i18n="login_footer">🔒 جميع البيانات مشفرة وآمنة</p>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorMsg = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                errorMsg.textContent = window.t('login_empty');
                errorMsg.classList.add('show');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = window.t('login_button_loading');
            errorMsg.classList.remove('show');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.shop.isAdmin) {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                } else {
                    errorMsg.textContent = '❌ ' + data.error;
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.textContent = window.t('login_connection_error');
                errorMsg.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = window.t('login_button');
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        async function checkSession() {
            try {
                const response = await fetch('/api/current-shop');
                const data = await response.json();
                if (data.success) {
                    if (data.shop.isAdmin) {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                }
            } catch (error) {
                console.log('No active session');
            }
        }
        checkSession();
    </script>
</body>
</html>
