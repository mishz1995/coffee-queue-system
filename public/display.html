<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة عرض QR - مقهى السعادة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .display-container {
            background: white;
            border-radius: 32px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }
        .qr-large img {
            width: 300px;
            height: 300px;
            margin: 20px auto;
            border-radius: 16px;
            background: white;
            padding: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        .order-number-display {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-screen {
            display: none;
        }
        .welcome-screen.active {
            display: block;
            animation: fadeIn 0.8s ease;
        }
        .qr-screen {
            display: block;
        }
        .qr-screen.hidden {
            display: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .shop-info {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: right;
        }
        .shop-info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .shop-info-item:last-child {
            border-bottom: none;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            margin-top: 12px;
        }
        .status-badge.waiting { background: #fef3c7; color: #92400e; }
        .status-badge.preparing { background: #fef3c7; color: #92400e; }
        .status-badge.ready { background: #d1fae5; color: #065f46; animation: pulse 1.5s infinite; }
        .status-badge.completed { background: #f1f5f9; color: #64748b; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .btn-close {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 999;
        }
        .btn-close:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <button class="btn-close" onclick="window.close()">✕ إغلاق</button>

    <div class="display-container" id="displayContainer">
        <!-- شاشة QR -->
        <div class="qr-screen" id="qrScreen">
            <h1 class="text-3xl font-bold text-gray-800">☕ مقهى السعادة</h1>
            <p class="text-gray-500 text-sm">اطبع أو اعرض هذا الرمز للعميل</p>
            <div class="qr-large" id="qrImageContainer">
                <img id="qrDisplayImage" src="" alt="QR Code">
            </div>
            <div class="order-number-display" id="qrOrderNumber">#0000</div>
            <div class="text-sm text-gray-400 mt-2" id="qrCustomerName">-</div>
            <div class="status-badge waiting" id="qrStatusBadge">⏳ في الانتظار</div>
            <p class="text-xs text-gray-400 mt-4">🔄 يتم التحديث تلقائياً عند مسح الرمز</p>
        </div>

        <!-- شاشة الترحيب -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="text-6xl mb-4">🎉</div>
            <h1 class="text-4xl font-bold text-gray-800">أهلاً بك!</h1>
            <p class="text-xl text-gray-600 mt-2" id="welcomeCustomerName">-</p>
            <div class="text-2xl font-bold text-purple-600 mt-2" id="welcomeOrderNumber">#0000</div>
            <div class="status-badge ready" id="welcomeStatusBadge">✅ مرحباً</div>

            <div class="shop-info">
                <h3 class="font-bold text-gray-700 mb-2">☕ معلومات المقهى</h3>
                <div class="shop-info-item">
                    <span>🕐</span>
                    <span>ساعات العمل: 6 صباحاً - 12 منتصف الليل</span>
                </div>
                <div class="shop-info-item">
                    <span>📍</span>
                    <span>الموقع: شارع الملك فهد، الرياض</span>
                </div>
                <div class="shop-info-item">
                    <span>📞</span>
                    <span>للتواصل: 050 123 4567</span>
                </div>
                <div class="shop-info-item">
                    <span>🎁</span>
                    <span>عرض اليوم: خصم 10% على جميع المشروبات</span>
                </div>
            </div>

            <button onclick="resetDisplay()" class="mt-4 bg-purple-600 text-white px-6 py-3 rounded-xl hover:bg-purple-700 transition">
                🔄 عرض QR مرة أخرى
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');
        let socket = null;
        let orderData = null;

        function initSocket() {
            socket = io();
            socket.on('connect', () => {
                console.log('✅ Display connected');
                if (orderId) {
                    socket.emit('join-order', orderId);
                }
            });

            socket.on('order-status', (order) => {
                console.log('📦 Display update:', order);
                orderData = order;
                updateDisplay(order);
            });

            socket.on('disconnect', () => {
                console.log('🔌 Display disconnected');
            });
        }

        function updateDisplay(order) {
            // تحديث شاشة QR
            if (order.qrCode) {
                document.getElementById('qrDisplayImage').src = order.qrCode;
            }
            document.getElementById('qrOrderNumber').textContent = `#${order.number}`;
            document.getElementById('qrCustomerName').textContent = order.customerName;

            const badge = document.getElementById('qrStatusBadge');
            badge.className = 'status-badge';
            const statusMap = {
                'waiting': { class: 'waiting', text: '⏳ في الانتظار' },
                'preparing': { class: 'preparing', text: '👨‍🍳 قيد التحضير' },
                'ready': { class: 'ready', text: '✅ جاهز للاستلام' },
                'completed': { class: 'completed', text: '📦 تم التسليم' }
            };
            const s = statusMap[order.status] || statusMap['waiting'];
            badge.classList.add(s.class);
            badge.textContent = s.text;

            // إذا تم مسح الرمز (أي دخل العميل للصفحة)، ننتقل لشاشة الترحيب
            // هنا نفترض أن العميل دخل عن طريق مسح الرمز، وتم تحديث الحالة إلى "preparing" أو "ready"
            // يمكننا أيضاً أن نعتمد على أي حالة غير "waiting"
            if (order.status !== 'waiting' && order.status !== 'completed') {
                showWelcome(order);
            } else if (order.status === 'completed') {
                // إذا تم التسليم، نعيد عرض QR مع رسالة منتهي
                showQR();
            } else {
                showQR();
            }
        }

        function showWelcome(order) {
            document.getElementById('qrScreen').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.add('active');

            document.getElementById('welcomeCustomerName').textContent = `👋 مرحباً ${order.customerName}`;
            document.getElementById('welcomeOrderNumber').textContent = `#${order.number}`;
            
            const badge = document.getElementById('welcomeStatusBadge');
            badge.className = 'status-badge ready';
            badge.textContent = '✅ مرحباً بك!';
        }

        function showQR() {
            document.getElementById('qrScreen').classList.remove('hidden');
            document.getElementById('welcomeScreen').classList.remove('active');
        }

        function resetDisplay() {
            showQR();
            // نطلب تحديث البيانات من السيرفر
            if (socket && orderId) {
                socket.emit('join-order', orderId);
            }
        }

        // التحقق من وجود orderId
        if (!orderId) {
            document.getElementById('displayContainer').innerHTML = `
                <div class="text-center py-12">
                    <div class="text-6xl mb-4">⚠️</div>
                    <h2 class="text-2xl font-bold text-gray-700">لم يتم تحديد طلب</h2>
                    <p class="text-gray-500">يرجى تمرير معرف الطلب في الرابط</p>
                </div>
            `;
        } else {
            initSocket();
        }

        // إغلاق النافذة بالضغط على ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.close();
        });
    </script>

</body>
</html>
