<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>بطاقة طلب المقهى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    <link rel="stylesheet" href="/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .btn-on-my-way {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            width: 100%;
        }
        .btn-on-my-way:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
        }
        .btn-on-my-way:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .notification-permission-btn {
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
        }
        .notification-permission-btn:hover {
            transform: translateX(-50%) scale(1.05);
        }
        .notification-popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 20px 30px;
            border-radius: 20px;
            z-index: 999999;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            width: 420px;
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .notification-popup:hover { transform: translateX(-50%) scale(1.02); }
        .notification-popup .notif-icon { font-size: 48px; display: block; margin-bottom: 8px; }
        .notification-popup .notif-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .notification-popup .notif-body { font-size: 16px; opacity: 0.9; }
        .notification-popup .notif-time { font-size: 12px; opacity: 0.7; margin-top: 8px; }
        .notification-popup .notif-close {
            position: absolute; top: 8px; right: 12px;
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 30px; height: 30px; border-radius: 50%; font-size: 16px;
            cursor: pointer; transition: background 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .notification-popup .notif-close:hover { background: rgba(255,255,255,0.3); }
        .notification-popup.success { background: linear-gradient(135deg, #10b981, #059669); animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), pulse-glow 2s infinite; }
        .notification-popup.info { background: linear-gradient(135deg, #3b82f6, #6366f1); }
        .notification-popup.warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .notification-popup.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        @keyframes popIn {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5) rotate(-10deg); }
            100% { opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg); }
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 20px 60px rgba(16, 185, 129, 0.3); }
            50% { box-shadow: 0 20px 80px rgba(16, 185, 129, 0.6); }
            100% { box-shadow: 0 20px 60px rgba(16, 185, 129, 0.3); }
        }
        .notification-badge {
            position: fixed; top: 10px; right: 10px;
            background: #ef4444; color: white; border-radius: 50%;
            width: 30px; height: 30px; display: none;
            align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; z-index: 99999;
            box-shadow: 0 4px 12px rgba(239,68,68,0.4);
            animation: pulse-badge 1.5s infinite; cursor: pointer;
        }
        .notification-badge.show { display: flex; }
        .sound-icon {
            position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%);
            font-size: 30px; z-index: 999; display: none;
            animation: bounce 0.5s infinite alternate;
        }
        .sound-icon.show { display: block; }
        @keyframes bounce {
            from { transform: translateX(-50%) scale(1); }
            to { transform: translateX(-50%) scale(1.2); }
        }
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="text-center">
            <div class="loader"></div>
            <p class="text-gray-600">جاري تحميل طلبك...</p>
        </div>
    </div>
    
    <div id="customerScreen" class="boarding-pass-wrapper" style="display: none;">
        <div class="boarding-pass">
            <div class="boarding-pass-inner">
                <div class="shop-header">
                    <div>
                        <div class="pass-type">بطاقة طلب</div>
                        <div class="shop-name"><span class="emoji">☕</span> مقهى السعادة</div>
                    </div>
                    <div class="order-number-container">
                        <div class="order-number-label">رقم الطلب</div>
                        <div class="order-number-display" id="orderNumber">0000</div>
                    </div>
                </div>
                
                <div class="status-section">
                    <div id="statusBadge" class="status-badge waiting">
                        <span id="statusText">في الانتظار</span>
                    </div>
                    <div id="statusMessage" class="status-message"></div>
                </div>
                
                <div class="order-details">
                    <div class="detail-row">
                        <span class="detail-label">اسم العميل</span>
                        <span class="detail-value" id="customerName">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">تفاصيل الطلب</span>
                        <span class="detail-value" id="orderDetails">-</span>
                    </div>
                </div>
                
                <div class="time-section">
                    <span>🕐 وقت الطلب</span>
                    <span class="time-value" id="orderTime">-</span>
                </div>
                
                <div class="barcode-divider"></div>
                
                <div class="qr-section">
                    <div class="qr-container">
                        <img id="qrCodeImage" src="" alt="QR Code">
                    </div>
                    <div class="qr-label">امسح الرمز لمتابعة طلبك</div>
                </div>
                
                <div id="notificationIndicator" class="notification-indicator">
                    <div class="icon">🔔</div>
                    <div class="title">طلبك جاهز!</div>
                    <div class="subtitle">سيتم تشغيل التنبيه والاهتزاز</div>
                </div>

                <!-- زر أنا في طريقي -->
                <div id="onMyWayContainer" style="display: none;">
                    <button id="onMyWayBtn" class="btn-on-my-way" onclick="onMyWay()">
                        🚗 أنا في طريقي
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="completedScreen" class="completed-screen" style="display: none;">
        <div class="completed-content">
            <span class="big-emoji">🎉</span>
            <h1>شكراً لزيارتك!</h1>
            <p>تم تسليم طلبك بنجاح</p>
            <p style="margin-top: 4px;">نتمنى أن تستمتع بمشروبك ☕</p>
            <button onclick="resetSession()" class="btn-reset">طلب جديد</button>
        </div>
    </div>

    <div id="notificationBadge" class="notification-badge" onclick="showAllNotifications()">
        <span id="badgeCount">0</span>
    </div>

    <div id="soundIcon" class="sound-icon">🔊</div>

    <button id="notifPermissionBtn" class="notification-permission-btn" onclick="requestNotificationPermission()">
        🔔 فعّل الإشعارات
    </button>

    <div id="statusBar" class="status-bar">
        <span class="dot green" id="statusDot"></span>
        <span id="statusText2">🟢 جاهز</span>
    </div>

    <script>
        // ============================================
        // 🔥 Firebase Configuration
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyD9Jkv0WzI_SSGAJXHM4w30PhPNhZbggXI",
            authDomain: "coffee-queue-system.firebaseapp.com",
            projectId: "coffee-queue-system",
            storageBucket: "coffee-queue-system.firebasestorage.app",
            messagingSenderId: "1014346204068",
            appId: "1:1014346204068:web:da385bc27605556fd1f731",
            measurementId: "G-694MM57SVM"
        };

        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        // ============================================
        // المتغيرات العامة
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');
        let socket = null;
        let orderData = null;
        let notificationPlayed = false;
        let notificationCount = 0;
        let notifications = [];

        // ============================================
        // الإشعارات المنبثقة
        // ============================================
        function showPopupNotification(title, message, type = 'success', icon = '✅') {
            notificationCount++;
            document.getElementById('badgeCount').textContent = notificationCount;
            document.getElementById('notificationBadge').classList.add('show');
            notifications.push({ title, message, type, icon, time: new Date() });
            
            const popup = document.createElement('div');
            popup.className = `notification-popup ${type}`;
            popup.innerHTML = `
                <button class="notif-close" onclick="this.parentElement.remove()">✕</button>
                <span class="notif-icon">${icon}</span>
                <div class="notif-title">${title}</div>
                <div class="notif-body">${message}</div>
                <div class="notif-time">${new Date().toLocaleTimeString('ar-EG')}</div>
            `;
            popup.onclick = function(e) {
                if (e.target.tagName !== 'BUTTON') {
                    this.style.transform = 'translateX(-50%) scale(0.9)';
                    this.style.opacity = '0';
                    setTimeout(() => this.remove(), 300);
                }
            };
            document.body.appendChild(popup);
            setTimeout(() => {
                if (popup.parentElement) {
                    popup.style.transform = 'translateX(-50%) scale(0.9)';
                    popup.style.opacity = '0';
                    setTimeout(() => popup.remove(), 300);
                }
            }, 10000);
            playNotificationSound();
            triggerVibration();
            updateBadge();
        }

        function updateBadge() {
            const badge = document.getElementById('notificationBadge');
            const count = document.getElementById('badgeCount');
            if (notificationCount > 0) {
                badge.classList.add('show');
                count.textContent = notificationCount;
            } else {
                badge.classList.remove('show');
            }
        }

        function showAllNotifications() {
            if (notifications.length === 0) return;
            let html = '<div style="padding:10px;max-height:300px;overflow-y:auto;">';
            notifications.forEach(n => {
                html += `
                    <div style="padding:8px;border-bottom:1px solid #e2e8f0;text-align:right;">
                        <div style="font-weight:600;">${n.icon} ${n.title}</div>
                        <div style="font-size:13px;color:#64748b;">${n.message}</div>
                        <div style="font-size:11px;color:#94a3b8;">${n.time.toLocaleTimeString('ar-EG')}</div>
                    </div>
                `;
            });
            html += '</div>';
            const existing = document.querySelectorAll('.in-app-notification');
            existing.forEach(el => el.remove());
            const notif = document.createElement('div');
            notif.className = 'in-app-notification info';
            notif.style.maxHeight = '400px';
            notif.style.overflow = 'auto';
            notif.innerHTML = `
                <div style="font-weight:700;font-size:18px;margin-bottom:10px;">📋 قائمة الإشعارات</div>
                ${html}
                <button onclick="this.parentElement.remove()" style="margin-top:10px;background:rgba(255,255,255,0.2);border:none;color:white;padding:6px 20px;border-radius:20px;cursor:pointer;">إغلاق</button>
                <button onclick="clearNotifications()" style="margin-top:10px;margin-right:8px;background:rgba(239,68,68,0.3);border:none;color:white;padding:6px 20px;border-radius:20px;cursor:pointer;">🗑️ مسح الكل</button>
            `;
            document.body.appendChild(notif);
        }

        function clearNotifications() {
            notificationCount = 0;
            notifications = [];
            document.getElementById('notificationBadge').classList.remove('show');
            const existing = document.querySelectorAll('.in-app-notification');
            existing.forEach(el => el.remove());
        }

        // ============================================
        // الصوت والاهتزاز
        // ============================================
        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.frequency.value = 880;
                osc1.type = 'sine';
                gain1.gain.value = 0.3;
                osc1.start();
                setTimeout(() => osc1.stop(), 200);
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.frequency.value = 660;
                    osc2.type = 'sine';
                    gain2.gain.value = 0.3;
                    osc2.start();
                    setTimeout(() => osc2.stop(), 200);
                }, 150);
                setTimeout(() => {
                    const osc3 = audioCtx.createOscillator();
                    const gain3 = audioCtx.createGain();
                    osc3.connect(gain3);
                    gain3.connect(audioCtx.destination);
                    osc3.frequency.value = 1100;
                    osc3.type = 'sine';
                    gain3.gain.value = 0.3;
                    osc3.start();
                    setTimeout(() => osc3.stop(), 300);
                }, 350);
                const soundIcon = document.getElementById('soundIcon');
                soundIcon.classList.add('show');
                setTimeout(() => soundIcon.classList.remove('show'), 1000);
            } catch (e) {}
        }

        function triggerVibration() {
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200, 100, 400]);
            }
            document.body.style.transition = 'background 0.1s';
            document.body.style.background = 'rgba(16, 185, 129, 0.15)';
            setTimeout(() => { document.body.style.background = ''; }, 300);
            setTimeout(() => { document.body.style.background = 'rgba(16, 185, 129, 0.15)'; }, 400);
            setTimeout(() => { document.body.style.background = ''; }, 500);
        }

        // ============================================
        // طلب إذن الإشعارات
        // ============================================
        async function requestNotificationPermission() {
            try {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    console.log('⚠️ Notification permission denied');
                    document.getElementById('notifPermissionBtn').style.display = 'block';
                    return;
                }

                document.getElementById('notifPermissionBtn').style.display = 'none';

                const token = await messaging.getToken({
                    vapidKey: 'BEl62iUYgUvxI4kRjBvZxMlMxNpOqQsTuVwXyZ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ'
                });

                console.log('✅ FCM Token:', token);

                const response = await fetch('/api/register-fcm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, orderId })
                });

                const data = await response.json();
                if (data.success) {
                    console.log('✅ FCM Token registered');
                    showPopupNotification('✅ تم التفعيل!', 'ستصلك الإشعارات عند تحديث طلبك', 'success', '🔔');
                }

                messaging.onMessage(function(payload) {
                    console.log('📱 Foreground message:', payload);
                    const title = payload.notification?.title || '☕ مقهى السعادة';
                    const body = payload.notification?.body || 'تحديث جديد';
                    showPopupNotification(title, body, 'success', '🔔');
                    playNotificationSound();
                    triggerVibration();
                });

            } catch (error) {
                console.error('❌ Error registering FCM:', error);
                document.getElementById('notifPermissionBtn').style.display = 'block';
            }
        }

        // ============================================
        // زر "أنا في طريقي"
        // ============================================
        async function onMyWay() {
            const btn = document.getElementById('onMyWayBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري الإرسال...';

            try {
                const response = await fetch('/api/on-my-way', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId })
                });

                const data = await response.json();
                if (data.success) {
                    btn.textContent = '✅ تم الإبلاغ!';
                    showPopupNotification('🚗 تم الإبلاغ!', 'البارستا يعلم أنك في الطريق', 'success', '✅');
                    setTimeout(() => {
                        btn.textContent = '🚗 أنا في طريقي';
                        btn.disabled = false;
                    }, 5000);
                }
            } catch (error) {
                console.error('❌ Error:', error);
                btn.textContent = '❌ حدث خطأ';
                setTimeout(() => {
                    btn.textContent = '🚗 أنا في طريقي';
                    btn.disabled = false;
                }, 3000);
            }
        }

        // ============================================
        // تحديث الحالة
        // ============================================
        function updateStatus(status, message) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText2');
            dot.className = 'dot';
            if (status === 'success') {
                dot.classList.add('green');
                text.textContent = '✅ ' + message;
            } else if (status === 'error') {
                dot.classList.add('red');
                text.textContent = '❌ ' + message;
            } else {
                dot.classList.add('yellow');
                text.textContent = '⏳ ' + message;
            }
        }

        // ============================================
        // Socket.io
        // ============================================
        function initSocket() {
            socket = io({
                reconnection: true,
                reconnectionAttempts: 10,
                reconnectionDelay: 1000
            });
            socket.on('connect', () => {
                console.log('✅ Connected to server');
                updateStatus('success', '🟢 متصل');
                if (orderId) {
                    socket.emit('join-order', orderId);
                }
            });
            socket.on('order-status', (order) => {
                const oldStatus = orderData ? orderData.status : null;
                orderData = order;
                updateUI(order);
                if (oldStatus && oldStatus !== order.status) {
                    const statusMessages = {
                        'waiting': '⏳ طلبك في قائمة الانتظار',
                        'preparing': '👨‍🍳 بدأ تحضير طلبك',
                        'ready': '✅ طلبك جاهز للاستلام!',
                        'completed': '📦 تم تسليم طلبك'
                    };
                    const titles = {
                        'waiting': '⏳ في الانتظار',
                        'preparing': '👨‍🍳 بدأ التحضير',
                        'ready': '☕ طلبك جاهز!',
                        'completed': '📦 تم التسليم'
                    };
                    const icons = {
                        'waiting': '⏳',
                        'preparing': '👨‍🍳',
                        'ready': '☕',
                        'completed': '📦'
                    };
                    if (order.status !== 'completed') {
                        showPopupNotification(
                            titles[order.status] || '☕ تحديث',
                            statusMessages[order.status] || '',
                            order.status === 'ready' ? 'success' : 'info',
                            icons[order.status] || '📢'
                        );
                    }
                }
                if (order.status === 'ready' && !notificationPlayed) {
                    showPopupNotification(
                        '☕ طلبك جاهز!',
                        `طلب رقم ${order.number} (${order.customerName}) جاهز للاستلام`,
                        'success',
                        '🎉'
                    );
                    notificationPlayed = true;
                }
            });
            socket.on('disconnect', () => {
                console.log('🔌 Disconnected');
                updateStatus('error', '🔴 غير متصل');
            });
            socket.on('reconnect', () => {
                console.log('🔄 Reconnected');
                updateStatus('success', '🟢 متصل');
                if (orderId) {
                    socket.emit('join-order', orderId);
                }
            });
            socket.on('error', (data) => {
                console.error('❌ Socket error:', data);
                showPopupNotification('⚠️ خطأ', data.message || 'حدث خطأ في الاتصال', 'error', '❌');
            });
        }

        // ============================================
        // تحديث الواجهة
        // ============================================
        function updateUI(order) {
            document.getElementById('loadingScreen').style.display = 'none';
            if (order.status === 'completed') {
                document.getElementById('customerScreen').style.display = 'none';
                document.getElementById('completedScreen').style.display = 'flex';
                return;
            }
            document.getElementById('customerScreen').style.display = 'flex';
            document.getElementById('completedScreen').style.display = 'none';
            document.getElementById('orderNumber').textContent = order.number;
            document.getElementById('customerName').textContent = order.customerName;
            document.getElementById('orderDetails').textContent = order.orderDetails;
            const date = new Date(order.timestamp);
            document.getElementById('orderTime').textContent = date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            if (order.qrCode) {
                document.getElementById('qrCodeImage').src = order.qrCode;
            }
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const statusMessage = document.getElementById('statusMessage');
            statusBadge.className = 'status-badge';
            let msg = '';
            switch(order.status) {
                case 'waiting':
                    statusBadge.classList.add('waiting');
                    statusText.textContent = '⏳ في الانتظار';
                    msg = 'طلبك في قائمة الانتظار، سيبدأ تحضيره قريباً';
                    break;
                case 'preparing':
                    statusBadge.classList.add('preparing');
                    statusText.textContent = '👨‍🍳 قيد التحضير';
                    msg = 'جاري تحضير طلبك، شكراً لصبرك';
                    break;
                case 'ready':
                    statusBadge.classList.add('ready');
                    statusText.textContent = '✅ جاهز للاستلام';
                    msg = 'طلبك جاهز! يمكنك التوجه لاستلامه';
                    break;
                case 'completed':
                    statusBadge.classList.add('completed');
                    statusText.textContent = '📦 تم التسليم';
                    msg = 'تم تسليم طلبك، نشكرك على زيارتك';
                    break;
                default:
                    statusText.textContent = 'غير معروف';
            }
            statusMessage.textContent = msg;
            const indicator = document.getElementById('notificationIndicator');
            if (order.status === 'ready') {
                indicator.classList.add('show');
                document.getElementById('onMyWayContainer').style.display = 'block';
            } else {
                indicator.classList.remove('show');
                document.getElementById('onMyWayContainer').style.display = 'none';
                notificationPlayed = false;
            }
        }

        function resetSession() {
            window.location.href = '/';
        }

        // ============================================
        // تشغيل عند تحميل الصفحة
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📱 Page loaded');
            if (orderId) {
                localStorage.setItem('currentOrder', JSON.stringify({ id: orderId }));
                initSocket();
                updateStatus('success', '🟢 جاهز');

                // طلب إذن الإشعارات بعد 3 ثواني
                setTimeout(() => {
                    requestNotificationPermission();
                }, 3000);

                setTimeout(() => {
                    showPopupNotification('☕ مرحباً بك!', 'ستصلك الإشعارات عند تحديث طلبك', 'info', '👋');
                }, 2000);
            } else {
                const savedOrder = localStorage.getItem('currentOrder');
                if (savedOrder) {
                    const savedOrderId = JSON.parse(savedOrder).id;
                    if (savedOrderId) {
                        window.location.href = `/?order=${savedOrderId}`;
                        return;
                    }
                }
                document.getElementById('loadingScreen').innerHTML = `
                    <div class="text-center p-8">
                        <div class="text-6xl mb-4">☕</div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">مرحباً بك!</h2>
                        <p class="text-gray-600">لم يتم العثور على طلب</p>
                        <p class="text-sm text-gray-500 mt-2">يرجى مسح رمز QR الخاص بطلبك</p>
                        <div class="mt-6 flex flex-col gap-3">
                            <a href="/dashboard.html" class="inline-block text-purple-600 hover:underline">📋 لوحة التحكم</a>
                        </div>
                    </div>
                `;
            }
        });

        window.addEventListener('beforeunload', function() {
            if (orderId) {
                localStorage.setItem('currentOrder', JSON.stringify({ id: orderId }));
            }
        });
    </script>
</body>
</html>
