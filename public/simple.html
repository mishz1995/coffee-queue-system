<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار بسيط</title>
    <style>
        body {
            font-family: system-ui;
            padding: 20px;
            text-align: center;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        button {
            padding: 20px 40px;
            font-size: 24px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-test { background: #667eea; color: white; }
        .btn-sound { background: #10b981; color: white; }
        .btn-vibrate { background: #f59e0b; color: white; }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            min-height: 80px;
            max-width: 90%;
            font-size: 18px;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .result-box.success { border-color: #10b981; background: rgba(16, 185, 129, 0.2); }
        .result-box.error { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }
        .result-box.info { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        #notificationBox {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 20px 30px;
            border-radius: 16px;
            z-index: 9999;
            display: none;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideDown 0.5s ease;
            max-width: 90%;
            text-align: center;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-50px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .status { margin-top: 20px; font-size: 14px; opacity: 0.6; }
    </style>
</head>
<body>
    <h1 style="font-size: 40px; margin-bottom: 10px;">🧪 اختبار بسيط</h1>
    <p style="opacity: 0.8; margin-bottom: 30px;">اختبر الإشعارات والصوت والاهتزاز</p>
    
    <button class="btn-test" onclick="showTestNotification()">🔔 عرض إشعار</button>
    <button class="btn-sound" onclick="playTestSound()">🔊 تشغيل صوت</button>
    <button class="btn-vibrate" onclick="testVibrate()">📱 اهتزاز</button>
    
    <div id="resultBox" class="result-box info">📱 اضغط على زر للاختبار</div>
    <div id="notificationBox">✅ هذا إشعار تجريبي!</div>
    <div class="status" id="statusText">جاري تحميل المعلومات...</div>

    <script>
        function setResult(message, type = 'info') {
            const box = document.getElementById('resultBox');
            box.textContent = message;
            box.className = 'result-box ' + type;
            console.log('📢', message);
        }

        function showTestNotification() {
            setResult('📱 جاري عرض الإشعار...', 'info');
            
            const notif = document.getElementById('notificationBox');
            notif.style.display = 'block';
            notif.textContent = '✅ هذا إشعار تجريبي! (ظهر داخل الصفحة)';
            notif.style.background = '#10b981';
            
            setTimeout(() => {
                notif.style.display = 'none';
                setResult('✅ تم إخفاء الإشعار', 'success');
            }, 5000);
            
            if ('Notification' in window) {
                Notification.requestPermission().then(perm => {
                    if (perm === 'granted') {
                        try {
                            new Notification('☕ اختبار', {
                                body: 'هذا إشعار من المتصفح',
                                icon: '☕'
                            });
                            setResult('✅ تم إرسال إشعار المتصفح أيضًا!', 'success');
                        } catch(e) {}
                    }
                });
            }
        }

        function playTestSound() {
            setResult('🔊 جاري تشغيل الصوت...', 'info');
            
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.frequency.value = 880;
                osc1.type = 'sine';
                gain1.gain.value = 0.2;
                osc1.start();
                setTimeout(() => osc1.stop(), 300);
                
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.frequency.value = 660;
                    osc2.type = 'sine';
                    gain2.gain.value = 0.2;
                    osc2.start();
                    setTimeout(() => osc2.stop(), 300);
                }, 200);
                
                setTimeout(() => setResult('✅ تم تشغيل الصوت بنجاح!', 'success'), 600);
            } catch (e) {
                setResult('❌ الصوت غير متاح: ' + e.message, 'error');
            }
        }

        function testVibrate() {
            setResult('📱 جاري تشغيل الاهتزاز...', 'info');
            
            document.body.style.animation = 'none';
            setTimeout(() => {
                document.body.style.animation = 'pulse 0.3s ease 3';
            }, 10);
            
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200, 100, 400]);
                setResult('✅ تم تشغيل الاهتزاز!', 'success');
            } else {
                setResult('⚠️ الاهتزاز غير مدعوم، تم استخدام تأثير بصري بديل', 'info');
                const notif = document.getElementById('notificationBox');
                notif.style.display = 'block';
                notif.textContent = '📱 تنبيه: الاهتزاز غير مدعوم على هذا الجهاز';
                notif.style.background = '#f59e0b';
                setTimeout(() => { notif.style.display = 'none'; }, 3000);
            }
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(0.98); }
                100% { transform: scale(1); }
            }
        `;
        document.head.appendChild(style);

        document.addEventListener('DOMContentLoaded', function() {
            const status = document.getElementById('statusText');
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            
            let text = '📱 ';
            if (isIOS) text += 'iPhone/iOS ✅, ';
            else if (isSafari) text += 'Safari ✅, ';
            else text += 'متصفح آخر, ';
            text += `المنصة: ${navigator.platform}`;
            status.textContent = text;
            
            setResult('📱 جاهز! اضغط على الأزرار للاختبار', 'info');
        });
    </script>
</body>
</html>
